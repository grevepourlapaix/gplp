<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grève pour la Paix</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; }

        .hero {
            background-image: url('hero.jpg');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            padding: 20px;
            position: relative;
        }

        .hero::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        .hero h1, .hero p, .hero .btn, .hero .counter {
            position: relative;
            z-index: 2;
        }

        .hero h1 { font-size: 3rem; max-width: 800px; margin-bottom: 20px; color: white; }
        .hero p { font-size: 1.2rem; margin-bottom: 30px; }
        .btn {
            background: #E30000;
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 5px;
            font-size: 1.2rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover { background: #C20000; }
        .counter { margin-top: 30px; font-size: 1.1rem; }

        /* Leaflets Section */
        .leaflets {
            background: #ffffff;
            padding: 60px 20px;
            text-align: center;
        }
        .leaflets h2 {
            color: #0033A0;
            font-size: 2rem;
            margin-bottom: 40px;
        }
        .leaflets-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            max-width: 900px;
            margin: 0 auto;
        }
        .leaflet {
            flex: 1;
            min-width: 280px;
            max-width: 400px;
        }
        .leaflet img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease;
        }
        .leaflet img:hover {
            transform: scale(1.02);
        }

        .footer {
            text-align: center;
            padding: 30px 20px;
            font-size: 0.9rem;
            color: #666;
            background: #f5f5f5;
        }
        .footer a { color: #0033A0; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }

        @media (max-width: 600px) {
            .hero h1 { font-size: 2rem; }
            .hero p { font-size: 1rem; }
            .leaflets-container { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>

    <!-- HERO SECTION -->
    <div class="hero">
        <h1>La justice n'est pas une option, c'est une obligation.</h1>
        <p>Rejoignez le mouvement français pour la paix et la justice en Palestine.</p>
        <a href="actualites.html" class="btn">JE FAIS LA GRÈVE</a>
        <p class="counter">✊ Déjà 5 234 citoyens mobilisés.</p>
    </div>

    <!-- LEAFLETS SECTION -->
    <div class="leaflets">
        <h2>📢 Prochaine grève pour la paix</h2>
        <div class="leaflets-container">
            <div class="leaflet">
                <img src="grevepourlapaix.jpg" alt="Tract 1 — Grève pour la Paix">
            </div>
            <div class="leaflet">
                <img src="greve2.jpg" alt="Tract 2 — Grève pour la Paix">
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
        © 2026 Grève pour la Paix — Indépendant et apartisan.
        <br>
        <a href="actualites.html">Actualités</a>
    </div>

</body>
</html>
