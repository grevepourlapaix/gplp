<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grève pour la Paix</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; }

        .hero {
            background-image: url('hero.jpg');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            padding: 20px;
            position: relative;
        }

        .hero::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        .hero h1, .hero p, .hero .btn, .hero .counter {
            position: relative;
            z-index: 2;
        }

        .hero h1 {
            font-size: 3rem;
            max-width: 800px;
            margin-bottom: 20px;
            color: white;
        }

        .hero p {
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        .btn {
            background: #E30000;
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 5px;
            font-size: 1.2rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .counter {
            margin-top: 30px;
            font-size: 1.1rem;
        }

        .footer {
            text-align: center;
            padding: 20px;
            font-size: 0.9rem;
            color: #666;
            background: #f5f5f5;
        }
    </style>
</head>
<body>

    <div class="hero">
        <h1>La justice n'est pas une option, c'est une obligation.</h1>
        <p>Rejoignez le mouvement français pour la paix et la justice en Palestine.</p>
        <a href="#" class="btn">JE FAIS LA GRÈVE</a>
        <p class="counter">✊ Déjà 5 234 citoyens mobilisés.</p>
    </div>

    <div class="footer">
        © 2026 Grève pour la Paix — Indépendant et apartisan.
    </div>

</body>
</html>
